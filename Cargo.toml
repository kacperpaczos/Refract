[workspace]
members = [
    "crates/domain",
    "crates/infra",
    "crates/app",
    "crates/ui"
]
resolver = "2"

[workspace.dependencies]
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
app = { path = "crates/app" }
ui = { path = "crates/ui" }

gtk4 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
simplelog = "0.12"
